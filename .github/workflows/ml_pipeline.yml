name: ML Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: .
      MLFLOW_TRACKING_URI: file:./mlruns

    steps:
      # 1️⃣ Checkout Repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Setup Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: "pip"

      # 3️⃣ Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4️⃣ Run Unit Tests (if tests folder exists)
      - name: Run tests
        run: |
          pip install pytest
          pytest || echo "No tests found"

      # 5️⃣ Run Training Pipeline
      - name: Run training
        run: |
          python -m src.train

      # 6️⃣ Upload MLflow Artifacts (optional but useful)
      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlruns
          path: mlruns/
