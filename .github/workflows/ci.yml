name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ✅ DEBUG ROOT (you'll see actual structure)
      - name: Debug root
        run: |
          pwd
          ls -la

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx flake8 black isort pytest-env

      - name: Lint
        run: flake8 src backend tests --max-line-length=120

      - name: Format check
        run: |
          black --check .
          isort --check-only .

      - name: Train pipeline
        env:
          PYTHONPATH: .
          MLFLOW_TRACKING_URI: file:./mlruns
        run: python -m src.pipeline.train_pipeline

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest tests/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deploy to Render
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
