name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# ✅ GLOBAL FIX: Correct working directory
defaults:
  run:
    working-directory: MLOps/mlops-pipeline

jobs:
  # ── Job 1: Test & Lint ──────────────────────────────────────────
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ✅ FIXED: Correct cache path
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('MLOps/mlops-pipeline/requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx flake8 black isort pytest-env

      # ✅ DEBUG STEP (VERY IMPORTANT)
      - name: Debug directory
        run: |
          echo "Current directory:"
          pwd
          echo "Files:"
          ls -la

      - name: Lint
        run: |
          flake8 src backend tests --max-line-length=120 --exclude=venv,__pycache__

      - name: Format check
        run: |
          black --check . --exclude "venv/"
          isort --check-only . --skip venv

      - name: Train pipeline (needed before tests)
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
          PYTHONPATH: .
        run: python -m src.pipeline.train_pipeline

      - name: Run tests with coverage
        env:
          MLFLOW_TRACKING_URI: file:./mlruns
          PYTHONPATH: .
        run: |
          pytest tests/ --cov=src --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml \
            -v

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
        continue-on-error: true

  # ── Job 2: Deploy to Render ─────────────────────────────────────
  deploy:
    needs: test
    runs-on: ubuntu-latest

    # ✅ Only deploy on push to main
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering Render Deploy..."
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
