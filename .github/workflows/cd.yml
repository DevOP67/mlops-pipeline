name: 🚀 CD — Deploy to Production

on:
  workflow_run:
    workflows: ["🧪 CI — Lint, Test & Validate"]
    types: [completed]
    branches: [main]

  # Allow manual trigger for hotfixes/rollbacks
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options: [production, staging]

# Only allow one deployment at a time
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ──────────────────────────────────────────
  # GUARD: Only deploy if CI passed
  # ──────────────────────────────────────────
  check-ci:
    name: 🛡️ CI Gate Check
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    outputs:
      should_deploy: ${{ steps.gate.outputs.deploy }}

    steps:
      - name: Evaluate deployment gate
        id: gate
        run: |
          if [[ "${{ github.event.workflow_run.conclusion }}" == "success" || \
                "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Gate passed — proceeding with deployment."
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "❌ CI did not pass — skipping deployment."
          fi

  # ──────────────────────────────────────────
  # JOB 1: Deploy to Staging (optional gate)
  # ──────────────────────────────────────────
  deploy-staging:
    name: 📦 Deploy to Staging
    runs-on: ubuntu-latest
    needs: check-ci
    if: needs.check-ci.outputs.should_deploy == 'true'
    environment:
      name: staging
      url: http://${{ vars.STAGING_SERVER_IP }}:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.STAGING_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to staging server
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.STAGING_SERVER_IP }} \
            "bash ~/mlops-pipeline/deploy/deploy.sh staging ${{ github.sha }}"

      - name: Staging health check
        run: |
          sleep 10
          curl -f http://${{ secrets.STAGING_SERVER_IP }}:8000/ \
            && echo "✅ Staging API is live!" \
            || (echo "❌ Staging health check failed!" && exit 1)

  # ──────────────────────────────────────────
  # JOB 2: Deploy to Production
  # ──────────────────────────────────────────
  deploy-production:
    name: 🌍 Deploy to Production
    runs-on: ubuntu-latest
    needs: [check-ci, deploy-staging]
    if: needs.check-ci.outputs.should_deploy == 'true'
    environment:
      name: production
      url: http://${{ vars.PROD_SERVER_IP }}:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.PROD_SERVER_IP }} >> ~/.ssh/known_hosts

      - name: 📤 Sync project files to server (rsync)
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='venv/' \
            --exclude='__pycache__/' \
            --exclude='*.pyc' \
            --exclude='mlruns/' \
            --exclude='mlflow.db' \
            --exclude='.github/' \
            ./ ${{ secrets.SERVER_USER }}@${{ secrets.PROD_SERVER_IP }}:~/mlops-pipeline/

      - name: 🚀 Run remote deployment script
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.PROD_SERVER_IP }} \
            "bash ~/mlops-pipeline/deploy/deploy.sh production ${{ github.sha }}"

      - name: ⏳ Wait for services to stabilize
        run: sleep 15

      - name: 🏥 Production health check — API
        run: |
          curl -f http://${{ secrets.PROD_SERVER_IP }}:8000/ \
            && echo "✅ Production API is live!" \
            || (echo "❌ Production API health check FAILED!" && exit 1)

      - name: 🏥 Production health check — MLflow UI
        run: |
          curl -f http://${{ secrets.PROD_SERVER_IP }}:5000/ \
            && echo "✅ MLflow UI is live!" \
            || echo "⚠️  MLflow UI not responding (non-critical)."

  # ──────────────────────────────────────────
  # JOB 3: Post-deployment notification
  # ──────────────────────────────────────────
  notify:
    name: 📣 Notify Deployment Result
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: always()

    steps:
      - name: Report deployment status
        run: |
          if [[ "${{ needs.deploy-production.result }}" == "success" ]]; then
            echo "🎉 Deployment to production SUCCEEDED!"
            echo "Commit: ${{ github.sha }}"
            echo "Triggered by: ${{ github.actor }}"
          else
            echo "💥 Deployment to production FAILED."
            echo "Please check the logs and consider rolling back."
          fi

      # Uncomment and configure to send Slack/Discord notifications:
      # - name: Notify Slack
