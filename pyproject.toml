[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--tb=short",
    "--strict-markers",
    "--no-header",
]
env = [
    "MLFLOW_TRACKING_URI=file:./mlruns",
    "PYTHONPATH=.",
]
markers = [
    "slow: marks tests that take >5s (deselect with -m 'not slow')",
    "integration: marks full pipeline integration tests",
    "unit: marks isolated unit tests",
]

[tool.coverage.run]
source = ["src", "backend"]
omit = ["venv/*", "tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 60

[tool.black]
line-length = 120
target-version = ["py310"]
exclude = '''
/(
    venv
  | __pycache__
  | \.git
)/
'''

[tool.isort]
profile = "black"
line_length = 120
skip = ["venv"]
