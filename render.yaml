services:
  - type: web
    name: mlops-pipeline
    env: python
    buildCommand: "./deploy/render_build.sh"
    startCommand: "uvicorn backend.app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: .
      - key: MLFLOW_TRACKING_URI
        value: file:./mlruns
      - key: MODEL_PATH
        value: artifacts/models/model.pkl
