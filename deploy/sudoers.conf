# =============================================================================
# deploy/sudoers.conf
# Sudoers drop-in for the deploy user — allows passwordless service control.
#
# INSTALL ON SERVER:
#   sudo cp deploy/sudoers.conf /etc/sudoers.d/mlops-deploy
#   sudo chmod 0440 /etc/sudoers.d/mlops-deploy
#   sudo visudo -c -f /etc/sudoers.d/mlops-deploy   # validate syntax
#
# Replace "ubuntu" below with your actual SERVER_USER if different.
# =============================================================================

# Allow the deploy user to start/stop/restart only the MLOps services
ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl start   mlops-api.service
ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl stop    mlops-api.service
ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl restart mlops-api.service
ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl status  mlops-api.service

ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl start   mlflow.service
ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl stop    mlflow.service
ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl restart mlflow.service
ubuntu ALL=(ALL) NOPASSWD: /bin/systemctl status  mlflow.service
